[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diabeticeye-ai"
version = "0.1.0"
description = "Multi-Modal Diabetic Complication Risk Predictor"
readme = "README.md"
license = { text = "MIT" }
authors = [
    {name = "Fadhi-source"}
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
train = [
    "wandb>=0.16.0",
    "optuna>=3.4.0",
]

[tool.setuptools.packages.find]
include = ["*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
